<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Production Dashboard — AI Agent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🎬 AI Agent</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container dashboard">
    <h1>Video Production Dashboard</h1>
    <p class="dashboard-subtitle">Track every video job as it moves through production.</p>

    <div class="dashboard-toolbar">
      <button id="new-job-btn" type="button" class="btn-primary">+ New Job</button>
    </div>

    <form id="new-job-form" class="new-job-form" hidden>
      <h2 class="new-job-form-title">New Video Production Job</h2>

      <div class="form-row">
        <label for="new-job-topic">Topic / Title</label>
        <input id="new-job-topic" type="text" placeholder="e.g. How black holes form">
      </div>

      <div class="form-row">
        <label for="new-job-duration">Duration</label>
        <input id="new-job-duration" type="text" placeholder="e.g. 5-10 minutes">
      </div>

      <div class="form-row">
        <label for="new-job-language">Language</label>
        <input id="new-job-language" type="text" placeholder="e.g. English">
      </div>

      <div class="form-row">
        <label for="new-job-style">Style</label>
        <input id="new-job-style" type="text" placeholder="e.g. Cinematic">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Create Job</button>
        <button type="button" id="new-job-cancel" class="btn-secondary">Cancel</button>
      </div>
    </form>

    <div id="dashboard-message" class="dashboard-message" hidden></div>

    <div class="dashboard-table-wrap">
      <table class="dashboard-table">
        <thead>
          <tr>
            <th>Job ID</th>
            <th>Topic / Title</th>
            <th>Duration</th>
            <th>Language</th>
            <th>Style</th>
            <th>Production Stage</th>
            <th>Confirmation</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobs-table-body">
          <tr>
            <td colspan="8" class="dashboard-empty">Loading jobs…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
